[package]
name = "gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rig-core = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "1"
futures = "0.3"
reqwest = { version = "0.11", features = ["stream"] }
tokio-stream = "0.1"
tempfile = "3"
chrono = "0.4"
dotenvy = "0.15"
serde_yaml = "0.9"

[dev-dependencies]
httpmock = "0.7"
libc = "0.2"
